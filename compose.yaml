name: nvgs-server

services:
  db:
    image: postgres:17.10-bookworm
    restart: "${NVGS_RESTART_POLICY:-unless-stopped}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nvgs_ticketing}
      POSTGRES_USER: ${POSTGRES_USER:-nvgs_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nvgs_app} -d ${POSTGRES_DB:-nvgs_ticketing}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
    restart: "${NVGS_RESTART_POLICY:-unless-stopped}"
    env_file:
      - .env
    environment:
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      APPSCRIPT_SSO_SECRET_FILE: /run/secrets/appscript_bridge_secret
      TICKET_NOTIFICATION_WEBHOOK_URL_FILE: /run/secrets/ticket_notification_webhook
      TICKET_NOTIFICATION_APPSCRIPT_SECRET_FILE: /run/secrets/appscript_notification_secret
      EMAIL_HOST_PASSWORD_FILE: /run/secrets/smtp_password
    secrets:
      - postgres_password
      - django_secret_key
      - appscript_bridge_secret
      - ticket_notification_webhook
      - appscript_notification_secret
      - smtp_password
    volumes:
      - ./imports:/imports:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
      - web
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=5)",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  notifications:
    build:
      context: .
    restart: "${NVGS_RESTART_POLICY:-unless-stopped}"
    entrypoint: ["python", "manage.py", "process_ticket_notifications"]
    env_file:
      - .env
    environment:
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      APPSCRIPT_SSO_SECRET_FILE: /run/secrets/appscript_bridge_secret
      TICKET_NOTIFICATION_WEBHOOK_URL_FILE: /run/secrets/ticket_notification_webhook
      TICKET_NOTIFICATION_APPSCRIPT_SECRET_FILE: /run/secrets/appscript_notification_secret
      EMAIL_HOST_PASSWORD_FILE: /run/secrets/smtp_password
    secrets:
      - postgres_password
      - django_secret_key
      - appscript_bridge_secret
      - ticket_notification_webhook
      - appscript_notification_secret
      - smtp_password
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - database
      - web
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: "${NVGS_RESTART_POLICY:-unless-stopped}"
    environment:
      SERVER_ADDRESS: ${SERVER_ADDRESS:-localhost}
      SERVER_BIND_IP: ${SERVER_BIND_IP:-127.0.0.1}
      CADDY_SITE_ADDRESSES: ${CADDY_SITE_ADDRESSES:-localhost}
    ports:
      - "${SERVER_BIND_IP:-127.0.0.1}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  django_secret_key:
    file: ./secrets/django_secret_key
  appscript_bridge_secret:
    file: ./secrets/appscript_bridge_secret
  ticket_notification_webhook:
    file: ./secrets/ticket_notification_webhook
  appscript_notification_secret:
    file: ./secrets/appscript_notification_secret
  smtp_password:
    file: ./secrets/smtp_password

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  database:
    internal: true
  web:
